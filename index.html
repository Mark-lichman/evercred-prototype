<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evercred Credential Verification - Research Prototype v6.6</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.3s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes slide-in-right {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
    
    /* Tour System Styles */
    .tour-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      pointer-events: none;
    }
    .tour-highlight {
      position: relative;
      z-index: 1001;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.5), 0 0 0 9999px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
    }
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-subtle { 
      animation: bounce-subtle 2s ease-in-out infinite; 
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================
    // URL PARAMETERS FOR TEST MODE OPTIONS
    // ============================================
    // Usage:
    //   ?skipWelcome=true  - Skip the welcome modal
    //   ?hideTokens=true   - Hide the token display
    //   ?minimal=true      - Minimal UI (no welcome, collapsed tour)
    const URL_PARAMS = new URLSearchParams(window.location.search);
    const TEST_MODE = {
      skipWelcome: URL_PARAMS.get('skipWelcome') === 'true' || URL_PARAMS.get('minimal') === 'true',
      hideTokens: URL_PARAMS.get('hideTokens') === 'true',
      minimal: URL_PARAMS.get('minimal') === 'true'
    };

    // Icon components using Lucide
    const Icon = ({ name, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          ref.current.appendChild(icon);
        }
      }, [name]);
      return <span ref={ref} className={`inline-flex ${className}`} style={{ width: '1em', height: '1em' }} />;
    };

    // ============================================
    // ORGANIZATION DASHBOARD DATA & COMPONENTS
    // ============================================
    
    // Mock data for credential packets (org dashboard view)
    const CREDENTIAL_PACKETS = [
      {
        id: 'pkt-001',
        practitionerName: 'Dr. Leah Houston',
        practitionerEmail: 'credentials@memorialhospital.org',
        credentialCount: 3,
        dateShared: 'Jan 15, 2026',
        previewEnds: 'Feb 15, 2026',
        status: 'opened',
        hasPacket: true,
        packetStatus: 'PROCESSING'
      },
      {
        id: 'pkt-002',
        practitionerName: 'Dr. Sarah Johnson',
        practitionerEmail: 'sjohnson@healthcare.com',
        credentialCount: 2,
        dateShared: 'Jan 18, 2026',
        previewEnds: 'Feb 18, 2026',
        status: 'received',
        hasPacket: true,
        packetStatus: 'PROCESSING'
      },
      {
        id: 'pkt-003',
        practitionerName: 'Dr. John Smith',
        practitionerEmail: 'jsmith@citymedical.org',
        credentialCount: 5,
        dateShared: 'Jan 20, 2026',
        previewEnds: 'Feb 20, 2026',
        status: 'received',
        hasPacket: true,
        packetStatus: 'COMPLETE'
      },
      {
        id: 'pkt-004',
        practitionerName: 'Dr. Michael Chen',
        practitionerEmail: 'mchen@regional.org',
        credentialCount: 0,
        dateShared: 'Jan 22, 2026',
        previewEnds: 'Feb 22, 2026',
        status: 'pending',
        hasPacket: true,
        packetStatus: 'PENDING'
      }
    ];
    
    // Mock data for sponsored practitioners (seat management)
    const SPONSORED_PRACTITIONERS = [
      {
        id: 'sp-001',
        name: 'Sarah Johnson, MD',
        email: 'sarah.johnson@hospital.com',
        accountType: 'organization',
        accessEnds: 'Permanent',
        assignedDate: 'Jan 10, 2026',
        lastLogin: '30 days ago',
        hasPacket: true,
        packetStatus: 'PROCESSING',
        packetId: 'pkt-002'
      },
      {
        id: 'sp-002',
        name: 'Michael Chen, MD',
        email: 'michael.chen@hospital.com',
        accountType: 'practitioner',
        accessEnds: '30 days',
        accessEndsDate: 'Feb 24, 2026',
        assignedDate: 'Jan 15, 2026',
        lastLogin: '2 days ago',
        hasPacket: true,
        packetStatus: 'PENDING',
        packetId: 'pkt-004'
      },
      {
        id: 'sp-003',
        name: 'Emily Williams, MD',
        email: 'emily.williams@hospital.com',
        accountType: 'practitioner',
        accessEnds: 'Expired',
        assignedDate: 'Dec 01, 2025',
        lastLogin: '45 days ago',
        hasPacket: false,
        packetStatus: null,
        packetId: null
      },
      {
        id: 'sp-004',
        name: 'Robert Martinez, DO',
        email: 'r.martinez@clinic.org',
        accountType: 'practitioner',
        accessEnds: '60 days',
        accessEndsDate: 'Mar 22, 2026',
        assignedDate: 'Jan 22, 2026',
        lastLogin: 'Never',
        hasPacket: false,
        packetStatus: null,
        packetId: null
      }
    ];
    
    // Seat overview data
    const SEAT_OVERVIEW = {
      assigned: 2,
      available: 1,
      purchased: 3
    };
    
    // Recent changes for sidebar
    const RECENT_CHANGES = [
      { user: 'Maria Santos', timestamp: 'Jan 22, 2026, 2:30 PM', action: 'Created packet', details: 'for Dr. Michael Chen' },
      { user: 'Maria Santos', timestamp: 'Jan 20, 2026, 10:15 AM', action: 'Uploaded credential', details: 'CA Medical License for Dr. Johnson' },
      { user: 'System', timestamp: 'Jan 20, 2026, 10:16 AM', action: 'OCR Complete', details: 'Extracted 8 fields from license' },
      { user: 'Maria Santos', timestamp: 'Jan 18, 2026, 3:45 PM', action: 'Invited practitioner', details: 'Dr. Sarah Johnson' },
      { user: 'Admin', timestamp: 'Jan 15, 2026, 9:00 AM', action: 'Purchased seats', details: '3 organization seats' }
    ];

    // ============================================
    // ORG SIDEBAR COMPONENT
    // ============================================
    const OrgSidebar = ({ currentView, onNavigate }) => {
      const navItems = [
        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
        { id: 'settings', icon: 'settings', label: 'Settings' }
      ];
      
      return (
        <div className="w-16 bg-white border-r border-slate-200 flex flex-col items-center py-4 gap-2">
          {navItems.map(item => (
            <button
              key={item.id}
              onClick={() => onNavigate(item.id)}
              className={`w-10 h-10 rounded-lg flex items-center justify-center transition-colors ${
                currentView === item.id || (currentView === 'packet-detail' && item.id === 'dashboard')
                  ? 'bg-indigo-100 text-indigo-600'
                  : 'text-slate-400 hover:bg-slate-100 hover:text-slate-600'
              }`}
              title={item.label}
            >
              <span className="w-5 h-5"><Icon name={item.icon} /></span>
            </button>
          ))}
          <div className="flex-1" />
          <button className="w-10 h-10 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" title="Notifications">
            <span className="w-5 h-5"><Icon name="bell" /></span>
          </button>
          <button className="w-10 h-10 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors" title="Log out">
            <span className="w-5 h-5"><Icon name="log-out" /></span>
          </button>
        </div>
      );
    };

    // ============================================
    // ORG DASHBOARD - CREDENTIAL PACKETS LIST
    // ============================================
    const OrgDashboard = ({ packets, onOpenPacket, onCreatePacket }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedPackets, setSelectedPackets] = useState([]);
      
      const filteredPackets = packets.filter(p => 
        p.practitionerName.toLowerCase().includes(searchTerm.toLowerCase()) ||
        p.practitionerEmail.toLowerCase().includes(searchTerm.toLowerCase())
      );
      
      const getStatusBadge = (status) => {
        const styles = {
          opened: 'bg-indigo-100 text-indigo-700 border-indigo-200',
          received: 'bg-slate-100 text-slate-700 border-slate-200',
          pending: 'bg-amber-100 text-amber-700 border-amber-200'
        };
        return (
          <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${styles[status] || styles.received}`}>
            {status.charAt(0).toUpperCase() + status.slice(1)}
          </span>
        );
      };
      
      const toggleSelectAll = () => {
        if (selectedPackets.length === filteredPackets.length) {
          setSelectedPackets([]);
        } else {
          setSelectedPackets(filteredPackets.map(p => p.id));
        }
      };
      
      const toggleSelect = (id) => {
        setSelectedPackets(prev => 
          prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id]
        );
      };
      
      return (
        <div className="flex-1 p-6 overflow-y-auto">
          <div className="mb-6">
            <h1 className="text-2xl font-bold text-slate-900">Credential Packets</h1>
            <p className="text-slate-600 mt-1">Track and manage credentials that have been shared with your organization.</p>
          </div>
          
          {/* Search and filters */}
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"><Icon name="search" /></span>
                <input
                  type="text"
                  placeholder="Search shared credentials..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent w-72"
                />
              </div>
              <button className="flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                <span className="w-4 h-4"><Icon name="sliders-horizontal" /></span>
                Filter
              </button>
            </div>
            <button className="flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">
              <span className="w-4 h-4"><Icon name="download" /></span>
              Download CSV
            </button>
          </div>
          
          {/* Packets table */}
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <table className="w-full">
              <thead>
                <tr className="border-b border-slate-200">
                  <th className="px-4 py-3 text-left">
                    <input 
                      type="checkbox" 
                      checked={selectedPackets.length === filteredPackets.length && filteredPackets.length > 0}
                      onChange={toggleSelectAll}
                      className="rounded border-slate-300"
                    />
                  </th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600">
                    <button className="flex items-center gap-1 hover:text-slate-900">
                      Sender <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                    </button>
                  </th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600">Credentials</th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600">
                    <button className="flex items-center gap-1 hover:text-slate-900">
                      Date Shared <span className="w-3 h-3"><Icon name="chevron-up" /></span>
                    </button>
                  </th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600">
                    <button className="flex items-center gap-1 hover:text-slate-900">
                      Preview Ends <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                    </button>
                  </th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600">
                    <button className="flex items-center gap-1 hover:text-slate-900">
                      Status <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                    </button>
                  </th>
                  <th className="px-4 py-3 text-left text-sm font-medium text-slate-600"></th>
                </tr>
              </thead>
              <tbody>
                {filteredPackets.map((packet) => (
                  <tr key={packet.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td className="px-4 py-4">
                      <input 
                        type="checkbox" 
                        checked={selectedPackets.includes(packet.id)}
                        onChange={() => toggleSelect(packet.id)}
                        className="rounded border-slate-300"
                      />
                    </td>
                    <td className="px-4 py-4">
                      <div>
                        <p className="font-medium text-slate-900">{packet.practitionerName}</p>
                        <p className="text-sm text-slate-500">{packet.practitionerEmail}</p>
                      </div>
                    </td>
                    <td className="px-4 py-4">
                      <span className={`text-sm ${packet.credentialCount === 0 ? 'text-slate-400 italic' : 'text-slate-900'}`}>
                        {packet.credentialCount === 0 ? 'Empty packet' : `${packet.credentialCount} credentials`}
                      </span>
                    </td>
                    <td className="px-4 py-4 text-sm text-slate-600">{packet.dateShared}</td>
                    <td className="px-4 py-4 text-sm text-slate-600">{packet.previewEnds}</td>
                    <td className="px-4 py-4">{getStatusBadge(packet.status)}</td>
                    <td className="px-4 py-4">
                      <div className="flex items-center gap-2">
                        <button 
                          onClick={() => onOpenPacket(packet)}
                          className="px-4 py-1.5 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors"
                        >
                          Open Packet
                        </button>
                        <button className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded transition-colors">
                          <span className="w-4 h-4"><Icon name="more-vertical" /></span>
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ============================================
    // ACCOUNT SETTINGS - MANAGE PRACTITIONERS
    // ============================================
    const ManagePractitioners = ({ practitioners, seatOverview, recentChanges, onCreatePacket, onOpenPacket }) => {
      const [activeTab, setActiveTab] = useState('active');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedPractitioners, setSelectedPractitioners] = useState([]);
      
      const activePractitioners = practitioners.filter(p => p.accessEnds !== 'Expired');
      const inboundCount = practitioners.filter(p => !p.hasPacket).length;
      
      const filteredPractitioners = (activeTab === 'active' ? activePractitioners : practitioners.filter(p => !p.hasPacket))
        .filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.email.toLowerCase().includes(searchTerm.toLowerCase()));
      
      const getAccountBadge = (type) => {
        if (type === 'organization') {
          return (
            <span className="flex items-center gap-1.5 text-sm text-slate-700">
              Organization <span className="w-4 h-4 text-slate-400"><Icon name="building-2" /></span>
            </span>
          );
        }
        return (
          <span className="flex items-center gap-1.5 text-sm text-slate-700">
            Practitioner <span className="w-4 h-4 text-slate-400"><Icon name="user" /></span>
          </span>
        );
      };
      
      const getAccessBadge = (accessEnds) => {
        if (accessEnds === 'Permanent') {
          return <span className="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-xs font-medium">Permanent</span>;
        }
        if (accessEnds === 'Expired') {
          return <span className="px-2 py-0.5 bg-orange-100 text-orange-700 rounded text-xs font-medium">Expired</span>;
        }
        return <span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded text-xs font-medium">{accessEnds}</span>;
      };
      
      const getPacketAction = (practitioner) => {
        if (practitioner.hasPacket) {
          return (
            <button 
              onClick={() => onOpenPacket(practitioner)}
              className="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors"
              title="Open Packet"
            >
              <span className="w-4 h-4"><Icon name="external-link" /></span>
            </button>
          );
        }
        return (
          <button 
            onClick={() => onCreatePacket(practitioner)}
            className="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded transition-colors"
            title="Create Packet"
          >
            <span className="w-4 h-4"><Icon name="send" /></span>
          </button>
        );
      };
      
      return (
        <div className="flex-1 overflow-y-auto">
          {/* Header */}
          <div className="px-6 py-4 border-b border-slate-200">
            <p className="text-sm text-slate-500">Account Settings</p>
            <h1 className="text-2xl font-bold text-slate-900">Account Settings</h1>
            <p className="text-slate-600 mt-1">Manage your account settings and preferences.</p>
          </div>
          
          {/* Tabs */}
          <div className="px-6 border-b border-slate-200">
            <div className="flex gap-6">
              <button className="py-3 text-sm text-slate-500 hover:text-slate-900 transition-colors">
                Contact Information
              </button>
              <button className="py-3 text-sm font-medium text-slate-900 border-b-2 border-slate-900">
                Manage Practitioners
              </button>
            </div>
          </div>
          
          <div className="p-6 flex gap-6">
            {/* Main content */}
            <div className="flex-1">
              <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <div className="p-4 border-b border-slate-100">
                  <h2 className="text-lg font-semibold text-slate-900">Practitioners</h2>
                  
                  {/* Sub-tabs */}
                  <div className="flex gap-4 mt-3">
                    <button 
                      onClick={() => setActiveTab('active')}
                      className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                        activeTab === 'active' ? 'bg-slate-100 text-slate-900' : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      Active ({activePractitioners.length})
                    </button>
                    <button 
                      onClick={() => setActiveTab('inbound')}
                      className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                        activeTab === 'inbound' ? 'bg-slate-100 text-slate-900' : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      Inbound ({inboundCount})
                    </button>
                  </div>
                </div>
                
                <div className="p-4 border-b border-slate-100">
                  <div className="flex items-center justify-between">
                    <p className="text-sm text-slate-600">
                      {activeTab === 'active' ? 'View and manage Practitioners who are active in your organization.' : 'Practitioners awaiting packet creation.'}
                    </p>
                  </div>
                  
                  <div className="flex items-center justify-between mt-3">
                    <div className="flex items-center gap-3">
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"><Icon name="search" /></span>
                        <input
                          type="text"
                          placeholder="Search Practitioners"
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                          className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent w-64"
                        />
                      </div>
                      <button className="flex items-center gap-2 px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                        <span className="w-4 h-4"><Icon name="sliders-horizontal" /></span>
                        Filter
                      </button>
                    </div>
                    <div className="flex items-center gap-2">
                      <button className="flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                        <span className="w-4 h-4"><Icon name="upload" /></span>
                        Bulk Import CSV
                      </button>
                      <button className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
                        <span className="w-4 h-4"><Icon name="send" /></span>
                        Invite Practitioner
                      </button>
                    </div>
                  </div>
                </div>
                
                {/* Table */}
                <table className="w-full">
                  <thead>
                    <tr className="border-b border-slate-100 bg-slate-50">
                      <th className="px-4 py-3 text-left">
                        <input type="checkbox" className="rounded border-slate-300" />
                      </th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">
                        <button className="flex items-center gap-1">
                          Practitioner <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                        </button>
                      </th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">
                        <button className="flex items-center gap-1">
                          Account <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                        </button>
                      </th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">Access ends</th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">
                        <button className="flex items-center gap-1">
                          Assigned <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                        </button>
                      </th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">
                        <button className="flex items-center gap-1">
                          Last login <span className="w-3 h-3"><Icon name="chevrons-up-down" /></span>
                        </button>
                      </th>
                      <th className="px-4 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wide">Packet</th>
                      <th className="px-4 py-3"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredPractitioners.map((practitioner) => (
                      <tr key={practitioner.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <td className="px-4 py-4">
                          <input type="checkbox" className="rounded border-slate-300" />
                        </td>
                        <td className="px-4 py-4">
                          <div>
                            <p className="font-medium text-slate-900">{practitioner.name}</p>
                            <p className="text-sm text-slate-500">{practitioner.email}</p>

    // ============================================
    // UPLOAD CREDENTIAL MODAL (for org uploads)
    // ============================================
    const UploadCredentialModal = ({ isOpen, onClose, practitioner, onUploadComplete }) => {
      const [uploadState, setUploadState] = useState('select'); // select, uploading, processing, success, failed
      const [selectedFile, setSelectedFile] = useState(null);
      const [progress, setProgress] = useState(0);
      
      const simulateUpload = () => {
        setUploadState('uploading');
        setProgress(0);
        
        const uploadInterval = setInterval(() => {
          setProgress(prev => {
            if (prev >= 100) {
              clearInterval(uploadInterval);
              setUploadState('processing');
              
              // Simulate OCR processing
              setTimeout(() => {
                setUploadState('success');
              }, 2000);
              
              return 100;
            }
            return prev + 20;
          });
        }, 300);
      };
      
      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setSelectedFile(file);
        }
      };
      
      const handleDrop = (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files?.[0];
        if (file) {
          setSelectedFile(file);
        }
      };
      
      const resetModal = () => {
        setUploadState('select');
        setSelectedFile(null);
        setProgress(0);
      };
      
      const handleClose = () => {
        resetModal();
        onClose();
      };
      
      const handleComplete = () => {
        onUploadComplete && onUploadComplete();
        handleClose();
      };
      
      if (!isOpen) return null;
      
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70] backdrop-blur-sm" onClick={handleClose}>
          <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full mx-4 overflow-hidden" onClick={e => e.stopPropagation()}>

                <span className="w-5 h-5 text-slate-400"><Icon name="x" /></span>
              </button>
            </div>
            
            <div className="p-6">
              {uploadState === 'select' && (
                <>
                  <div 
                    className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-indigo-400 hover:bg-indigo-50/50 transition-colors cursor-pointer"
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={handleDrop}
                    onClick={() => document.getElementById('file-input').click()}
                  >
                    <input 
                      type="file" 
                      id="file-input" 
                      className="hidden" 
                      accept=".pdf,.png,.jpg,.jpeg"
                      onChange={handleFileSelect}
                    />
                    <div className="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-4">
                      <span className="w-6 h-6 text-indigo-600"><Icon name="upload-cloud" /></span>
                    </div>
                    <p className="text-slate-900 font-medium mb-1">
                      {selectedFile ? selectedFile.name : 'Drop file here or click to browse'}
                    </p>
                    <p className="text-sm text-slate-500">PDF, PNG, or JPG up to 25MB</p>
                  </div>
                  
                  {selectedFile && (
                    <div className="mt-4 p-3 bg-slate-50 rounded-lg flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="w-8 h-8 bg-indigo-100 rounded flex items-center justify-center">
                          <span className="w-4 h-4 text-indigo-600"><Icon name="file-text" /></span>
                        </span>
                        <div>
                          <p className="text-sm font-medium text-slate-900">{selectedFile.name}</p>
                          <p className="text-xs text-slate-500">{(selectedFile.size / 1024 / 1024).toFixed(2)} MB</p>
                        </div>
                      </div>
                      <button onClick={() => setSelectedFile(null)} className="text-slate-400 hover:text-slate-600">
                        <span className="w-4 h-4"><Icon name="x" /></span>
                      </button>
                    </div>
                  )}
                  
                  <div className="flex gap-3 mt-6">
                    <button onClick={handleClose} className="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl text-slate-700 font-medium hover:bg-slate-50 transition-colors">
                      Cancel
                    </button>
                    <button 
                      onClick={simulateUpload}
                      disabled={!selectedFile}
                      className="flex-1 px-4 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      Upload & Process
                    </button>
                  </div>
                </>
              )}
              
              {uploadState === 'uploading' && (
                <div className="py-8 text-center">
                  <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <span className="w-8 h-8 text-indigo-600 animate-pulse"><Icon name="upload" /></span>
                  </div>
                  <p className="font-semibold text-slate-900 mb-2">Uploading...</p>
                  <p className="text-sm text-slate-500 mb-4">{selectedFile?.name}</p>
                  <div className="w-full bg-slate-200 rounded-full h-2 mb-2">
                    <div className="bg-indigo-600 h-2 rounded-full transition-all" style={{ width: `${progress}%` }} />
                  </div>
                  <p className="text-xs text-slate-500">{progress}% complete</p>
                </div>
              )}
              
              {uploadState === 'processing' && (
                <div className="py-8 text-center">
                  <div className="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <span className="w-8 h-8 text-amber-600 animate-spin"><Icon name="loader-2" /></span>
                  </div>

              {uploadState === 'success' && (

                      <p className="text-sm text-slate-500">OCR extracted 8 fields</p>
                    </div>
                  </div>
                  
                  <div className="bg-slate-50 rounded-xl p-4 mb-4">
                    <p className="text-xs text-slate-500 uppercase tracking-wide mb-2">Extracted Information</p>
                    <div className="grid grid-cols-2 gap-3 text-sm">
                      <div>
                        <p className="text-slate-500">Type</p>
                        <p className="font-medium text-slate-900">Medical License</p>
                      </div>
                      <div>
                        <p className="text-slate-500">State</p>
                        <p className="font-medium text-slate-900">California</p>
                      </div>
                      <div>
                        <p className="text-slate-500">License #</p>
                        <p className="font-medium text-slate-900">A123456</p>
                      </div>
                      <div>
                        <p className="text-slate-500">Expiration</p>
                        <p className="font-medium text-slate-900">12/31/2026</p>
                      </div>
                    </div>
                  </div>
                  
                  <button 
                    onClick={handleComplete}
                    className="w-full px-4 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 transition-colors"
                  >
                    Done
                  </button>
                </div>
              )}
              
              {uploadState === 'failed' && (
                <div className="py-8 text-center">
                  <div className="w-16 h-16 bg-orange-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <span className="w-8 h-8 text-orange-600"><Icon name="alert-circle" /></span>

                  <p className="font-semibold text-slate-900 mb-2">Could not extract data</p>
                  <p className="text-sm text-slate-500 mb-4">The document was saved but OCR couldn't read it.</p>
                  <div className="flex gap-3">

                      Enter Manually
                    </button>
                  </div>
                </div>
              )}
            </div>

    // Tour Provider Component
    function TourProvider({ children, onResetDemo }) {
      const [showWelcome, setShowWelcome] = useState(!TEST_MODE.skipWelcome);
      const [tourActive, setTourActive] = useState(false);
      const [currentStep, setCurrentStep] = useState(0);
      const [tourMinimized, setTourMinimized] = useState(TEST_MODE.minimal);

      const startTour = () => {
        setShowWelcome(false);
        setTourActive(true);
        setTourMinimized(false);
        setCurrentStep(0);
      };

      const skipTour = () => {
        setShowWelcome(false);
        setTourActive(false);
      };

      const nextStep = () => {
        if (currentStep < TOUR_STOPS.length - 1) {
          setCurrentStep(currentStep + 1);
        } else {
          setTourActive(false);
        }
      };

      const prevStep = () => {
        if (currentStep > 0) {
          setCurrentStep(currentStep - 1);
        }
      };

      const skipTourMidway = () => {
        setTourActive(false);
      };

      const restartTour = () => {
        setTourActive(true);
        setTourMinimized(false);
        setCurrentStep(0);
      };

      const closeTourCompletely = () => {
        setTourActive(false);
        setTourMinimized(true);
      };

      // Keyboard shortcuts for moderators
      useEffect(() => {
        const handleKeyDown = (e) => {
          // Escape closes any modal or minimizes tour
          if (e.key === 'Escape' && tourActive) {
            setTourMinimized(true);
          }
          // Ctrl+Shift+R resets demo
          if (e.ctrlKey && e.shiftKey && e.key === 'R') {
            e.preventDefault();
            onResetDemo && onResetDemo();
          }
          // T toggles tour
          if (e.key === 't' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            if (tourActive) {
              setTourMinimized(!tourMinimized);
            } else {
              restartTour();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [tourActive, tourMinimized, onResetDemo]);

      const currentTourStop = TOUR_STOPS[currentStep];

      return (
        <>
          {showWelcome && (
            <TourWelcomeModal onStart={startTour} onSkip={skipTour} />
          )}

          {/* Floating control buttons - bottom right, out of the way */}
          {!showWelcome && (
            <div className="fixed bottom-6 right-6 flex flex-col gap-2 z-40">
              {!tourActive && (
                <button
                  onClick={restartTour}
                  className="bg-indigo-600 text-white px-4 py-2.5 rounded-full shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2"
                  title="Restart Tour (Press T)"
                >
                  <span className="w-4 h-4"><Icon name="help-circle" /></span>
                  <span className="font-medium text-sm">Tour</span>
                </button>
              )}
              <button
                onClick={onResetDemo}
                className="bg-slate-600 text-white px-4 py-2.5 rounded-full shadow-lg hover:bg-slate-700 transition-all flex items-center gap-2"
                title="Reset Demo (Ctrl+Shift+R)"
              >
                <span className="w-4 h-4"><Icon name="refresh-cw" /></span>
                <span className="font-medium text-sm">Reset</span>
              </button>
            </div>
          )}

          {tourActive && (
            <TourTooltip
              step={currentStep}
              totalSteps={TOUR_STOPS.length}
              title={currentTourStop.title}
              description={currentTourStop.description}
              tasks={currentTourStop.tasks}
              onNext={nextStep}
              onPrev={prevStep}
              onSkip={skipTourMidway}
              minimized={tourMinimized}
              onMinimize={() => setTourMinimized(true)}
              onExpand={() => setTourMinimized(false)}
              onClose={closeTourCompletely}
            />
          )}

          {children}
        </>
      );
    }

          'credentials_shared': 'share-2',

        const key = Object.keys(iconMap).find(k => lowerType.includes(k));
        return iconMap[key] || 'activity';

        const colorMap = {
          'Green': 'bg-emerald-500',
          'Blue': 'bg-blue-500',
          'Yellow': 'bg-amber-500',

          case 'critical': return 'bg-red-500';
          case 'high': return 'bg-yellow-500';
          case 'medium': return 'bg-blue-500';
          case 'low': return 'bg-green-500';

          nameOnRecord: 'HOUSTON, LEAH CHRISTINE MD',
          expiryDate: 'N/A',
          verificationMethod: 'Automated',
          verifiedBy: 'Evercred AI-Agent + Manual Review',
          verificationPortal: 'Multiple Sources',
          taskId: 'task_cv_20260114_0900',
          verificationTime: '4 hours 23 min',
          verificationProof: { name: 'verification-proof.png', isProof: true },
          activityFeed: [
            { type: 'complete', description: 'Employment History Verification Complete - 6 positions verified', timestamp: 'Jan 14, 2026 1:30 PM', color: 'Green', children: [
              { type: 'complete', description: 'Final review completed by Maria Santos', timestamp: 'Jan 14, 2026 1:30 PM', color: 'Green' },
              { type: 'complete', description: 'Gap explanation accepted: 01/2018-11/2019', timestamp: 'Jan 14, 2026 1:25 PM', color: 'Green' }
            ]},
            { type: 'phone', description: 'Phone Verification: St Johns Episcopal Hospital', timestamp: 'Jan 14, 2026 12:45 PM', color: 'Green' },
            { type: 'upload', description: 'CV Document Uploaded and Processed', timestamp: 'Jan 14, 2026 9:00 AM', color: 'Green' }
          ],
          documents: [{ name: 'leah_houston_cv.pdf', pages: 2 }]
        }
      ]);

      const handleVerifyClick = (credential) => {
        if (tokens < credential.tokenCost) return;
        setSelectedCredential(credential);
        setShowModal(true);
      };

      const handleConfirmVerify = () => {
        setShowModal(false);
        setVerifyingId(selectedCredential.id);
        setTokens(prev => prev - (selectedCredential.tokenCost || 1));
        
        setCredentials(prev => prev.map(c => 
          c.id === selectedCredential.id ? { ...c, status: 'PROCESSING' } : c
        ));
        
        setTimeout(() => {
          setCredentials(prev => prev.map(c => 
            c.id === selectedCredential.id ? { 
              ...c, 
              status: 'VERIFIED',
              verificationMethod: 'Automated',
              verifiedBy: 'Evercred AI-Agent',
              verificationPortal: c.type === 'Medical License' ? `${c.state} Medical Board` : 
                                 c.type === 'DEA Registration' ? 'DEA NTIS Database' :
                                 c.type === 'Board Certification' ? 'ABMS Certification Portal' : 'Primary Source',
              taskId: `task_${Date.now()}`,
              verificationTime: '2 min 37 sec',
              verificationProof: { name: 'verification-proof.png', isProof: true },
              activityFeed: [
                { type: 'complete', description: 'Verification completed successfully', timestamp: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }), color: 'Green' },
                ...(c.activityFeed || [])
              ]
            } : c
          ));
          setVerifyingId(null);
        }, 3000);
      };

      const handleDocumentClick = (doc) => {
        setSelectedDocument(doc);
        setShowDocPreview(true);
      };

      const handleViewProof = (credential) => {
        setSelectedCredential(credential);
        setShowProofModal(true);
      };
      
      const handleViewCredential = (credential) => {
        setSelectedCredential(credential);
        setShowCredentialDetail(true);
      };
      
      const handleRequestCredentials = (request) => {
        // Add new activity to the packet activities
        const newActivity = {
          type: 'Additional Credentials Requested',
          description: `Harbor UCLA Medical Center has requested ${request.credentials.length} additional credentials`,
          timestamp: 'Just now',
          status: 'Pending',
          attentionLevel: 'High',
          actor: 'Maria Santos',
          items: request.credentials
        };
        
        // In a real app, this would update state
        console.log('Credential request submitted:', request);
        console.log('New activity:', newActivity);
      };
      
      const verifiedCount = credentials.filter(c => c.status === 'VERIFIED').length;
      const totalCount = credentials.length;
      
      // =====================================================
      // ORG-LEVEL NAVIGATION HANDLERS
      // =====================================================
      const handleOrgNavigate = (view) => {
        setOrgView(view);
        if (view !== 'packet-detail' && view !== 'empty-packet') {
          setSelectedPacket(null);
          setSelectedPractitioner(null);
        }
      };
      
      const handleOpenPacket = (packet) => {
        setSelectedPacket(packet);
        if (packet.packetStatus === 'PENDING' || packet.credentialCount === 0) {
          // Find the practitioner for this packet
          const practitioner = practitioners.find(p => p.packetId === packet.id) || {
            name: packet.practitionerName,
            email: packet.practitionerEmail
          };
          setSelectedPractitioner(practitioner);
          setOrgView('empty-packet');
        } else {
          setOrgView('packet-detail');
        }
      };
      
      const handleOpenPacketFromPractitioner = (practitioner) => {
        const packet = packets.find(p => p.id === practitioner.packetId);
        if (packet) {
          setSelectedPacket(packet);
          setSelectedPractitioner(practitioner);
          if (packet.packetStatus === 'PENDING' || packet.credentialCount === 0) {
            setOrgView('empty-packet');
          } else {
            setOrgView('packet-detail');
          }
        }
      };
      
      const handleCreatePacket = (practitioner) => {
        setSelectedPractitioner(practitioner);
        setShowCreatePacketModal(true);
      };
      
      const handleConfirmCreatePacket = (practitioner) => {
        // Create new packet
        const newPacket = {
          id: `pkt-${Date.now()}`,
          practitionerName: practitioner.name,
          practitionerEmail: practitioner.email,
          credentialCount: 0,
          dateShared: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          previewEnds: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          status: 'pending',
          hasPacket: true,
          packetStatus: 'PENDING'
        };
        
        // Update packets list
        setPackets([...packets, newPacket]);
        
        // Update practitioner
        setPractitioners(practitioners.map(p => 
          p.id === practitioner.id 
            ? { ...p, hasPacket: true, packetStatus: 'PENDING', packetId: newPacket.id }
            : p
        ));
        
        setShowCreatePacketModal(false);
        setSelectedPacket(newPacket);
        setSelectedPractitioner(practitioner);
        setOrgView('empty-packet');
      };
      
      const handleUploadComplete = () => {
        // After upload, update packet status and navigate to detail view
        if (selectedPacket) {
          const updatedPacket = { ...selectedPacket, credentialCount: 1, packetStatus: 'PROCESSING', status: 'received' };
          setPackets(packets.map(p => p.id === selectedPacket.id ? updatedPacket : p));
          setSelectedPacket(updatedPacket);
        }
        setShowUploadModal(false);
        // Stay on current view to show the new credential
      };
      
      // =====================================================
      // RENDER
      // =====================================================
      return (
        <div className="min-h-screen bg-slate-50 flex">
          {/* Org Sidebar */}
          <OrgSidebar currentView={orgView} onNavigate={handleOrgNavigate} />
          
          {/* Main Content */}
          <div className="flex-1 flex flex-col">
            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
              <div className="flex items-center justify-between px-6 py-3">
                <div className="flex items-center gap-6">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center">
                      <span className="w-5 h-5 text-white"><Icon name="shield" /></span>
                    </div>
                    <span className="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Evercred</span>
                  </div>
                  <nav className="flex items-center gap-1 text-sm text-slate-500">
                    {orgView === 'dashboard' && <span className="text-slate-900 font-medium">Organization Dashboard</span>}
                    {orgView === 'settings' && <span className="text-slate-900 font-medium">Account Settings</span>}
                    {(orgView === 'packet-detail' || orgView === 'empty-packet') && (
                      <>
                        <button onClick={() => handleOrgNavigate('dashboard')} className="hover:text-slate-700">Organization Dashboard</button>
                        <span className="w-4 h-4"><Icon name="chevron-right" /></span>
                        <span className="text-slate-900 font-medium">{selectedPacket?.practitionerName || selectedPractitioner?.name}</span>
                      </>
                    )}
                  </nav>
                </div>
                <div className="flex items-center gap-4">
                  {!TEST_MODE.hideTokens && (
                    <button onClick={() => setShowCreditsPanel(true)} className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-amber-100 to-orange-100 rounded-xl border border-amber-200">
                      <span className="w-4 h-4 text-amber-600"><Icon name="coins" /></span>
                      <span className="font-semibold text-amber-700">{tokens} tokens</span>
                    </button>
                  )}
                  <button 
                    onClick={() => setShowVersionInfo(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg border border-slate-200 transition-colors group"
                    title="View version information and release notes"
                  >
                  <span className="w-4 h-4 text-slate-600 group-hover:text-slate-900"><Icon name="info" /></span>
                  <span className="text-xs font-semibold text-slate-600 group-hover:text-slate-900">v6.6</span>
                </button>
                <button className="p-2 hover:bg-slate-100 rounded-lg relative">
                  <span className="w-5 h-5 text-slate-500"><Icon name="bell" /></span>
                  <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full" />
                </button>
                <button className="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm">MS</button>
              </div>
            </div>
          </header>
          
          {/* =====================================================
              ORG DASHBOARD VIEW
              ===================================================== */}
          {orgView === 'dashboard' && (
            <OrgDashboard 
              packets={packets} 
              onOpenPacket={handleOpenPacket}
              onCreatePacket={handleCreatePacket}
            />
          )}
          
          {/* =====================================================
              SETTINGS / MANAGE PRACTITIONERS VIEW
              ===================================================== */}
          {orgView === 'settings' && (
            <ManagePractitioners 
              practitioners={practitioners}
              seatOverview={SEAT_OVERVIEW}
              recentChanges={RECENT_CHANGES}
              onCreatePacket={handleCreatePacket}
              onOpenPacket={handleOpenPacketFromPractitioner}
            />
          )}
          
          {/* =====================================================
              EMPTY PACKET VIEW
              ===================================================== */}
          {orgView === 'empty-packet' && selectedPractitioner && (
            <EmptyPacketView 
              practitioner={selectedPractitioner}
              onUploadCredential={() => setShowUploadModal(true)}
              onBack={() => handleOrgNavigate('dashboard')}
            />
          )}
          
          {/* =====================================================
              PACKET DETAIL VIEW (existing)
              ===================================================== */}
          {orgView === 'packet-detail' && (
            <>
              <div className="bg-white border-b border-slate-200 px-6 py-4">
                <h1 className="text-xl font-semibold text-slate-900">Credential Packet: <span className="font-bold">{selectedPacket?.practitionerName || 'Dr. Leah Houston'}</span></h1>
              </div>
              
              <div className="flex h-[calc(100vh-121px)]">
                <Sidebar activeSection={activeSection} onSectionChange={setActiveSection} physicianName={selectedPacket?.practitionerName || "Leah Houston, MD"} verifiedCount={verifiedCount} totalCount={totalCount} credentials={credentials} />
                
                <main className="flex-1 overflow-y-auto p-6">
                  {activeSection === 'dashboard' && (
                <OverviewView credentials={credentials} physician={physician} onVerify={handleVerifyClick} onViewCredential={handleViewCredential} onViewProof={handleViewProof} packetActivities={packetActivities} onRequestCredentials={() => setShowRequestCredentialsModal(true)} urgentItems={urgentItems} />
              )}
              
              {activeSection === 'contact' && (
                <ContactDemographicsView physician={physician} missingItems={missingItems} onRequestInfo={() => setShowRequestInfoModal(true)} />
              )}
              
              {activeSection === 'licenses' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Licenses ({credentials.filter(c => c.type === 'Medical License' || c.type === 'DEA Registration').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Medical License' || c.type === 'DEA Registration').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'boards' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Board Certifications ({credentials.filter(c => c.type === 'Board Certification').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Board Certification').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'education' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Education & Training ({credentials.filter(c => c.type === 'Residency').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Residency').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'work' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Work History</h2>
                  {credentials.filter(c => c.type === 'Employment History').map(cred => (
                    <EmploymentHistoryCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onDocumentClick={handleDocumentClick} />
                  ))}
                </div>
              )}
              
              {!['dashboard', 'contact', 'licenses', 'boards', 'education', 'work'].includes(activeSection) && (
                <div className="flex items-center justify-center h-96">
                  <div className="text-center">
                    <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                      <span className="w-8 h-8 text-slate-400"><Icon name="file-text" /></span>
                    </div>
                    <h3 className="text-lg font-semibold text-slate-900 mb-2 capitalize">{activeSection}</h3>
                    <p className="text-slate-500">This section is under development</p>
                  </div>
                </div>
              )}
            </main>
          </div>
            </>
          )}
          
          {/* Toast */}
          {verifyingId && (
            <div className="fixed bottom-6 right-6 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 max-w-sm animate-slide-up">
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center flex-shrink-0">
                  <span className="w-5 h-5 text-indigo-600 animate-spin"><Icon name="loader-2" /></span>
                </div>
                <div>
                  <p className="font-semibold text-slate-900">Verification in Progress</p>
                  <p className="text-sm text-slate-500 mt-1">AI Agent navigating to verification portal...</p>
                </div>
              </div>
            </div>
          )}
          
          </div>
          
          {/* =====================================================
              MODALS (shared across all views)
              ===================================================== */}
          <CostConfirmationModal credential={selectedCredential} onConfirm={handleConfirmVerify} onCancel={() => setShowModal(false)} isOpen={showModal} currentTokens={tokens} />
          <CreditsPanel 
            isOpen={showCreditsPanel} 
            onClose={() => setShowCreditsPanel(false)} 
            currentTokens={tokens}
            verifications={{
              inProgress: [
                { physicianName: 'Leah Houston', credential: 'Medical License', progress: 65 }
              ],
              completed: [
                { physicianName: 'Leah Houston', credential: 'Medical License - California', verified: true },
                { physicianName: 'Leah Houston', credential: 'Medical License - New York', verified: true }
              ]
            }}
          />
          <VersionInfoModal isOpen={showVersionInfo} onClose={() => setShowVersionInfo(false)} />
          <DocumentPreviewModal document={selectedDocument} isOpen={showDocPreview} onClose={() => setShowDocPreview(false)} />
          <VerificationProofModal credential={selectedCredential} isOpen={showProofModal} onClose={() => setShowProofModal(false)} />
          <RequestMissingInfoModal isOpen={showRequestInfoModal} onClose={() => setShowRequestInfoModal(false)} physician={physician} missingItems={missingItems} />
          <RequestCredentialsModal isOpen={showRequestCredentialsModal} onClose={() => setShowRequestCredentialsModal(false)} onSubmit={handleRequestCredentials} physicianName={physician.name} />
          <CredentialDetailModal credential={selectedCredential} isOpen={showCredentialDetail} onClose={() => setShowCredentialDetail(false)} onVerify={handleVerifyClick} onViewProof={handleViewProof} onDocumentClick={handleDocumentClick} />
          
          {/* Org-level modals */}
          <CreatePacketModal 
            isOpen={showCreatePacketModal} 
            onClose={() => setShowCreatePacketModal(false)} 
            practitioner={selectedPractitioner}
            onConfirm={handleConfirmCreatePacket}
          />
          <UploadCredentialModal 
            isOpen={showUploadModal} 
            onClose={() => setShowUploadModal(false)}
            practitioner={selectedPractitioner}
            onUploadComplete={handleUploadComplete}
          />
        </div>
      );
    }

    // Global reset function for demo
    const resetDemo = () => {
      window.location.reload();
    };

    ReactDOM.render(
      <TourProvider onResetDemo={resetDemo}>
        <App />
      </TourProvider>, 
      document.getElementById('root')
    );
  </script>
</body>
</html>
