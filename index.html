      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.3s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes slide-in-right {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }

    const { useState, useEffect } = React;

    // Icon components using Lucide
    const Icon = ({ name, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          ref.current.appendChild(icon);
        }
      }, [name]);
      return <span ref={ref} className={`inline-flex ${className}`} style={{ width: '1em', height: '1em' }} />;
    };

      const [selectedCredentials, setSelectedCredentials] = useState([]);
      const [note, setNote] = useState('');
      const [requestDate, setRequestDate] = useState(new Date().toISOString().split('T')[0]);

      const availableCredentials = [
        'Medical Degree',
        'DEA Registration',
        'Fellowship',
        'CME/CE',
        'BLS',
        'ACLS',
        'PALS',
        'Malpractice Insurance',
        'Board Certification',
        'References',
        'Work History',
        'Hospital Privileges'
      ];

      const handleToggle = (cred) => {
        setSelectedCredentials(prev =>
          prev.includes(cred) ? prev.filter(c => c !== cred) : [...prev, cred]
        );
      };

      const handleSubmit = () => {
        if (selectedCredentials.length > 0) {
          onSubmit({
            credentials: selectedCredentials,
            note: note,
            date: requestDate
          });
          setSelectedCredentials([]);
          setNote('');
          onClose();
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 animate-slide-up">
          <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div className="p-6 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white z-10">
              <div>
                <h2 className="text-2xl font-bold text-slate-900">Request credential</h2>
                <p className="text-slate-600 mt-1">Ask {physicianName} for specific credentials to complete their packet.</p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg">
                <span className="w-6 h-6 text-slate-400"><Icon name="x" /></span>
              </button>
            </div>
            
            <div className="p-6 space-y-6">

                    placeholder="Select credential type or start typing here"

                    readOnly

                    <Icon name="chevron-down" />
                  </span>
                </div>
              </div>

                <label className="block text-sm font-semibold text-slate-900 mb-3">
                  Requesting the following credentials...
                </label>
                <div className="flex flex-wrap gap-2">
                  {availableCredentials.map(cred => (
                    <button
                      key={cred}
                      onClick={() => handleToggle(cred)}
                      className={`px-4 py-2 rounded-lg font-medium transition-all ${
                        selectedCredentials.includes(cred)
                          ? 'bg-slate-100 text-slate-900 border-2 border-slate-300'
                          : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300'

              >
                Send Request

            </div>

      const statusConfig = {
        VERIFIED: { bg: 'bg-emerald-100', text: 'text-emerald-700', icon: 'check-circle', label: 'VERIFIED' },
        UNVERIFIED: { bg: 'bg-amber-100', text: 'text-amber-700', icon: 'alert-triangle', label: 'UNVERIFIED' },
        PROCESSING: { bg: 'bg-blue-100', text: 'text-blue-700', icon: 'loader-2', label: 'PROCESSING', animate: true },
        EXPIRED: { bg: 'bg-red-100', text: 'text-red-700', icon: 'x-circle', label: 'EXPIRED' },
        FAILED: { bg: 'bg-red-100', text: 'text-red-700', icon: 'x-circle', label: 'FAILED' },
        MANUAL: { bg: 'bg-purple-100', text: 'text-purple-700', icon: 'user-check', label: 'MANUAL' },
        API_VERIFIED: { bg: 'bg-cyan-100', text: 'text-cyan-700', icon: 'zap', label: 'API VERIFIED' },
        DISCIPLINARY: { bg: 'bg-orange-100', text: 'text-orange-700', icon: 'alert-octagon', label: 'DISCIPLINARY ACTION' }
      };
      const config = statusConfig[status] || statusConfig.UNVERIFIED;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${config.bg} ${config.text}`}>

    // =====================================================
    // REQUEST MISSING INFORMATION MODAL
    // =====================================================
    const RequestMissingInfoModal = ({ isOpen, onClose, physician, missingItems }) => {
      const [selectedItems, setSelectedItems] = useState([]);
      const [selectAll, setSelectAll] = useState(true);
      const [priority, setPriority] = useState('');
      const [requestedBy, setRequestedBy] = useState('');
      const [note, setNote] = useState('');
      
      useEffect(() => {
        if (isOpen) {
          const allItems = [];
          missingItems.forEach(category => {
            category.items.forEach(item => {
              allItems.push(`${category.category}-${item}`);
            });
          });
          setSelectedItems(allItems);
          setSelectAll(true);
        }
      }, [isOpen, missingItems]);
      
      if (!isOpen) return null;
      
      const handleSelectAll = (checked) => {
        setSelectAll(checked);
        if (checked) {
          const allItems = [];
          missingItems.forEach(category => {
            category.items.forEach(item => {
              allItems.push(`${category.category}-${item}`);
            });
          });
          setSelectedItems(allItems);
        } else {
          setSelectedItems([]);
        }
      };
      
      const handleItemToggle = (categoryName, item) => {
        const key = `${categoryName}-${item}`;
        if (selectedItems.includes(key)) {
          setSelectedItems(selectedItems.filter(i => i !== key));
          setSelectAll(false);
        } else {
          setSelectedItems([...selectedItems, key]);
        }
      };
      
      return (

                  <span className="text-sm text-slate-600">Select All</span>
                </label>

                      <div className="px-4 py-3 bg-slate-50">
                        <span className="text-sm font-medium text-slate-700">{category.category}</span>
                      </div>
                      <div className="px-4 py-2 space-y-2">
                        {category.items.map((item, itemIdx) => (
                          <label key={itemIdx} className="flex items-center gap-3 py-1">
                            <input type="checkbox" checked={selectedItems.includes(`${category.category}-${item}`)} onChange={() => handleItemToggle(category.category, item)} className="rounded border-slate-300" />
                            <span className="text-sm text-slate-700">{item}</span>

      const getActivityIcon = (type) => {
        const lowerType = type?.toLowerCase() || '';
        const iconMap = {
          'request sent': 'send',
          'request_sent': 'send',
          'credentials shared': 'share-2',
          'credentials_shared': 'share-2',
          'additional credentials requested': 'mail-plus',
          'credentials added': 'plus-circle',
          'wallet opened': 'eye',
          'wallet_opened': 'eye',
          'link extended': 'clock',
          'link expiring': 'alert-circle',
          'link expired': 'alert-triangle',
          'access revoked': 'shield-off',
          'packet reshared': 'refresh-cw',
          'review complete': 'clipboard-check',
          'verification in progress': 'loader',
          'verification_started': 'shield',
          'verification complete': 'check-circle',
          'verification_complete': 'check-circle',
          'verification issues': 'alert-triangle',
          'committee approved': 'award',
          'committee_approved': 'award',
          'committee denied': 'x-circle',

          'ocr_complete': 'scan',
          'issue_flagged': 'alert-triangle',

        };
        const key = Object.keys(iconMap).find(k => lowerType.includes(k));
        return iconMap[key] || 'activity';
      };
      
      const getActivityColor = (color) => {
        const colorMap = {
          'Green': 'bg-emerald-500',
          'Blue': 'bg-blue-500',
          'Yellow': 'bg-amber-500',
          'Red': 'bg-red-500'
        };
        return colorMap[color] || 'bg-slate-400';
      };
      
      const getAttentionLevelColor = (level) => {
        switch(level?.toLowerCase()) {
          case 'critical': return 'bg-red-500';
          case 'high': return 'bg-yellow-500';
          case 'medium': return 'bg-blue-500';
          case 'low': return 'bg-green-500';
          default: return 'bg-slate-400';
        }
      };
      
      return (
        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

                    <div className="flex items-center gap-2">

                      <p className="text-sm text-slate-900">{activity.description}</p>

                    {activity.items && activity.items.length > 0 && (
                      <ul className="mt-2 ml-6 space-y-1">

                          <li key={i} className="text-xs text-slate-600 flex items-center gap-2">

              )}
              
              {activeSection === 'contact' && (
                <ContactDemographicsView physician={physician} missingItems={missingItems} onRequestInfo={() => setShowRequestInfoModal(true)} />
              )}
              
              {activeSection === 'licenses' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Licenses ({credentials.filter(c => c.type === 'Medical License' || c.type === 'DEA Registration').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Medical License' || c.type === 'DEA Registration').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'boards' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Board Certifications ({credentials.filter(c => c.type === 'Board Certification').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Board Certification').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'education' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Education & Training ({credentials.filter(c => c.type === 'Residency').length})</h2>
                  <div className="space-y-4">
                    {credentials.filter(c => c.type === 'Residency').map(cred => (
                      <CredentialCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onViewCredential={handleViewCredential} />
                    ))}
                  </div>
                </div>
              )}
              
              {activeSection === 'work' && (
                <div>
                  <h2 className="text-2xl font-bold text-slate-900 mb-6">Work History</h2>
                  {credentials.filter(c => c.type === 'Employment History').map(cred => (
                    <EmploymentHistoryCard key={cred.id} credential={cred} onVerify={handleVerifyClick} onViewProof={handleViewProof} onDocumentClick={handleDocumentClick} />
                  ))}
                </div>
              )}
              
              {!['dashboard', 'contact', 'licenses', 'boards', 'education', 'work'].includes(activeSection) && (
                <div className="flex items-center justify-center h-96">
                  <div className="text-center">
                    <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                      <span className="w-8 h-8 text-slate-400"><Icon name="file-text" /></span>
                    </div>
                    <h3 className="text-lg font-semibold text-slate-900 mb-2 capitalize">{activeSection}</h3>
                    <p className="text-slate-500">This section is under development</p>
                  </div>
                </div>
              )}
            </main>
          </div>
          
          {/* Toast */}
          {verifyingId && (
            <div className="fixed bottom-6 right-6 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 max-w-sm animate-slide-up">
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center flex-shrink-0">
                  <span className="w-5 h-5 text-indigo-600 animate-spin"><Icon name="loader-2" /></span>
                </div>
                <div>
                  <p className="font-semibold text-slate-900">Verification in Progress</p>
                  <p className="text-sm text-slate-500 mt-1">AI Agent navigating to verification portal...</p>
                </div>
              </div>
            </div>
          )}
          
          <CostConfirmationModal credential={selectedCredential} onConfirm={handleConfirmVerify} onCancel={() => setShowModal(false)} isOpen={showModal} currentTokens={tokens} />
          <DocumentPreviewModal document={selectedDocument} isOpen={showDocPreview} onClose={() => setShowDocPreview(false)} />
          <VerificationProofModal credential={selectedCredential} isOpen={showProofModal} onClose={() => setShowProofModal(false)} />
          <RequestMissingInfoModal isOpen={showRequestInfoModal} onClose={() => setShowRequestInfoModal(false)} physician={physician} missingItems={missingItems} />
          <RequestCredentialsModal isOpen={showRequestCredentialsModal} onClose={() => setShowRequestCredentialsModal(false)} onSubmit={handleRequestCredentials} physicianName={physician.name} />
          <CredentialDetailModal credential={selectedCredential} isOpen={showCredentialDetail} onClose={() => setShowCredentialDetail(false)} onVerify={handleVerifyClick} onViewProof={handleViewProof} onDocumentClick={handleDocumentClick} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
